[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitrix"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai-agents==0.24.0"]

[project.optional-dependencies]
docs = ["markdown-it-py==4.0.0"]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
omnitrix = "omnitrix.cli:main"

[tool.setuptools]
packages = ["omnitrix"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
omnitrix = ["web/*.html", "web/*.css", "web/*.js", "web/docs/*", "web/docs/experiments/*.json"]
